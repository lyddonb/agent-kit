name: validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 6"        # Saturdays 09:17 UTC: the weekly run with every property-test seed

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # versions compares against the PR's base branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generated files are up to date
        run: make check

      - name: Portability lint
        run: python3 tools/validate.py

      - name: Changed plugins bump their version
        if: github.event_name == 'pull_request'
        run: make versions BASE=origin/${{ github.base_ref }}

      - name: Script unit tests, recorded
        env:
          # the two heaviest property tests check 5 seeds on a pull request or push, all 40 weekly
          QUALITY_FULL_SEEDS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: make record RECORD_OUT="$RUNNER_TEMP/test-results.jsonl" RECORD_WORKERS="$(nproc)"

      - name: Upload the test record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-agent-kit
          path: ${{ runner.temp }}/test-results.jsonl
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Claude Code manifest validation
        run: |
          npm install -g @anthropic-ai/claude-code
          make claude-validate

      - name: install.sh smoke test
        run: |
          HOME="$(mktemp -d)" bash scripts/install.sh
          HOME="$(mktemp -d)" bash scripts/install.sh --dry-run --claude
